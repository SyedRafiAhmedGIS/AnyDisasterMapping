name: Release

# Round 5: on a version tag, build the Python distribution (sdist + wheel),
# checksum it, and attach everything to the GitHub Release.
#
# Tag checklist (see GITHUB_UPLOAD_INSTRUCTIONS.md §5):
#   git tag v5.0.0 && git push origin main --tags

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build toolchain
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
