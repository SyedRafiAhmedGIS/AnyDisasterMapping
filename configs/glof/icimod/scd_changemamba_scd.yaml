task: scd
num_classes: 3
ignore_index: 255
seed: 42
model:
  name: changemamba_scd
  kwargs:
    output_cd: 2
    output_clf: 3
    in_chans: 4
    pretrained: null
    backbone: vssm_tiny_224_0229flex
dataset:
  name: glof_icimod
  train:
    dataset_path: data/glof/ICIMOD
    data_list_path: data/glof/ICIMOD/train.txt
    split: train
    task: scd
  val:
    dataset_path: data/glof/ICIMOD
    data_list_path: data/glof/ICIMOD/val.txt
    split: val
    task: scd
  test:
    dataset_path: data/glof/ICIMOD
    data_list_path: data/glof/ICIMOD/test.txt
    split: test
    task: scd
augmentation:
  train:
    RandomCrop:
      height: 256
      width: 256
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    RandomRotate90:
      p: 1.0
    Normalize:
      mean: [0.485, 0.456, 0.406, 0.55]
      std: [0.229, 0.224, 0.225, 0.25]
      max_pixel_value: 1.0
  val:
    Normalize:
      mean: [0.485, 0.456, 0.406, 0.55]
      std: [0.229, 0.224, 0.225, 0.25]
      max_pixel_value: 1.0
optimizer:
  name: AdamW
  learning_rate: 0.0001
  weight_decay: 0.005
scheduler:
  name: CosineAnnealingLR
  step_mode: epoch
  kwargs:
    T_max: 100
loss:
  use_lovasz: False
  lovasz_weight: 0.75
training:
  num_epochs: 100
  train_batch_size: 4
  eval_batch_size: 1
  num_workers: 4
  metric_for_best_model: Sek
output_dir: ./results/glof/icimod/scd_changemamba_scd
