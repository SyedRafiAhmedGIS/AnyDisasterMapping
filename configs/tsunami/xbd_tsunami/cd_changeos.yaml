task: cd
num_classes: 2
ignore_index: 255
seed: 42
model:
  name: changeos
  kwargs:
    in_channels: 6
    loc_classes: 2
    num_classes: 2
    backbone: resnet18
    pretrained_backbone: False
    siamese_mode: shared
dataset:
  name: tsunami_inundation
  train:
    dataset_path: data/tsunami/XBD_TSUNAMI
    data_list_path: data/tsunami/XBD_TSUNAMI/train.txt
    split: train
  val:
    dataset_path: data/tsunami/XBD_TSUNAMI
    data_list_path: data/tsunami/XBD_TSUNAMI/val.txt
    split: val
  test:
    dataset_path: data/tsunami/XBD_TSUNAMI
    data_list_path: data/tsunami/XBD_TSUNAMI/test.txt
    split: test
augmentation:
  train:
    RandomCrop:
      height: 256
      width: 256
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    RandomRotate90:
      p: 1.0
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      max_pixel_value: 1.0
  val:
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      max_pixel_value: 1.0
optimizer:
  name: AdamW
  learning_rate: 0.0001
  weight_decay: 0.005
scheduler:
  name: CosineAnnealingLR
  step_mode: epoch
  kwargs:
    T_max: 100
loss:
  use_lovasz: False
  lovasz_weight: 0.75
training:
  num_epochs: 100
  train_batch_size: 8
  eval_batch_size: 1
  num_workers: 4
  metric_for_best_model: clf_f1
output_dir: ./results/tsunami/xbd_tsunami/cd_changeos
