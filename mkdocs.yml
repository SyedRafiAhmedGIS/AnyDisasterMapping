site_name: AnyDisasterMapping
site_description: >-
  A unified satellite disaster-mapping framework: 3 task contracts (seg / cd / scd),
  34 registered models, 24 benchmark datasets, 628 configs — companion to
  SSRN 6725082 (Earth Observation for Disaster Mapping).
site_url: https://syedrafiahmedgis.github.io/AnyDisasterMapping/
repo_url: https://github.com/SyedRafiAhmedGIS/AnyDisasterMapping
repo_name: SyedRafiAhmedGIS/AnyDisasterMapping

theme:
  name: material
  palette:
    # palette toggles keep both modes accessible
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tools & Deployment: TOOLS.md
  - Architecture: ARCHITECTURE.md
  - Extending the framework: EXTENSION_GUIDE.md
  - Additional disasters: ADDITIONAL_DISASTERS.md
  - Data versioning: DATA_VERSIONING.md
  - Disaster domains:
      - Avalanche: domains/avalanche.md
      - Dust storm: domains/dust_storm.md
      - Flood: domains/flood.md
      - GLOF: domains/glof.md
      - Hurricane: domains/hurricane.md
      - Infrastructure damage: domains/infra_damage.md
      - Landslide: domains/landslide.md
      - Locust: domains/locust.md
      - Oil spill: domains/oil_spill.md
      - Smoke plume: domains/smoke_plume.md
      - Tsunami: domains/tsunami.md
      - Volcano: domains/volcano.md
      - Wildfire: domains/wildfire.md
